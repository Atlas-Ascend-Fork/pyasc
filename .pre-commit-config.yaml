repos:
  - repo: https://gitcode.com/gh_mirrors/ya/yapf
    rev: v0.43.0
    hooks:
      - id: yapf
        args: ["-p", "-i"]

  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff

  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v20.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]

  # OAT compliance check (Open Source Audit Tool)
  - repo: local
    hooks:
      - id: oat-check
        name: OAT Compliance Check
        entry: bash scripts/oat_check.sh
        language: system
        pass_filenames: true
        types: [file]
        stages: [pre-commit]
        verbose: true
