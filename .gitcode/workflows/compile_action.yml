name: compile_action

on:
  workflow_call:
    inputs:
      task_name:
        required: true
        type: string
      package_name:
        required: true
        type: string
      arch:
        required: false
        type: string
        default: 'x64'
      spec:
        required: false
        type: string
        default: 'large'
      image_version:
        required: true
        type: string
    outputs:
      arm_run_url:
        value: ${{jobs.JOB_compile.outputs.primary-url}}
      arm_run_key:
        value: ${{jobs.JOB_compile.outputs.primary-key}}
      package_name:
        value: ${{jobs.JOB_compile.outputs.package_name}}
jobs:
  JOB_compile:
    name: compile
    select: selected_by_default
    needs: []
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          allow-unsafe-pr-checkout: true
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: test
        run: |
          echo "+++++++++++++++++++++++++++"
          echo "${{ steps.process_checkout.outputs.path }}"
          ls -l ${{ steps.process_checkout.outputs.path }}
          whoami
      -
        name: oidc_auth
        uses: huaweicloud-oidc-auth
        with:
          audience: ${{ secrets.audience }}
          agency_urn: ${{ secrets.agency_urn }}
          provider_urn: ${{ secrets.provider_urn }}
          region: cn-north-4
          duration: 3600
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/update_file_detail.txt
            ${{ env.obs_path }}/compile.sh
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: compile_acc
        identifier: compile
        uses: build-accelerate
        with:
          command: |
            export WORKSPACE=${{ steps.process_checkout.outputs.path }}
            cd ${{ steps.process_checkout.outputs.path }}
            export task_name=${{ inputs.task_name }}
            export package_name=${{ inputs.package_name }}
            BuildAccelerate bash compile.sh
          AC_SERVER_IP: ${{ vars.AC_SERVER_IP }}
      - name: verify_package
        uses: cann/.gitcode/actions/verify-package@master
        with:
          workspace: ${{ steps.process_checkout.outputs.path }}
          package_type: whl
      - name: upload
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          artifact-path: "${{ steps.process_checkout.outputs.path }}/build_out/${{ steps.compile.outputs.package_name }}"
          object-prefix: ${{ env.obs_path }}/
    if: "${{ default() }}"
    runs-on:
      - self-hosted
      - arch=${{ inputs.arch }}
      - spec=${{ inputs.spec }}
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ inputs.image_version }}
