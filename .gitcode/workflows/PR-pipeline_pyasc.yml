name: PR-pipeline_pyasc

concurrency:
  max: 15
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^/?compile(@[A-Za-z0-9._-]+)?$' ]
  pr_comment:
    types: [ created ]
    keyword: '^/?compile(@[A-Za-z0-9._-]+)?$'

env:
  org_name: "${{ vars.ORG_NAME }}"
  repo_name: ${{atomgit.event.repository.name}}
  MERGE_ID: ${{atomgit.event.pull_request.number}}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  obs_smoke_path: "${{ env.obs_path }}/presmoke/2"
  TARGET_BRANCH: ${{atomgit.ref_name}}
  SOURCE_BRANCH: ${{atomgit.head_ref}}
  online: ${{ vars.APPLY_LABEL }}

stages:
  stage1:
    name: PreBuild
    select: selected_by_default
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              comment: ${{ atomgit.event.comment.body }}
              token: ${{ secrets.TESTTOKEN }}
          -
            name: show_output
            run: |
              echo "image: ${{ steps.revise_image.outputs.Compile_Ascend_X86 }}"
        if: "${{ default() }}"
        runs-on: ["self-hosted", "arch=x64", "spec=small"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        permissions:
          repository: read
          id-token: write
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: Compile
    select: selected_by_default
    jobs:
      Compile_Ascend_X86:
        permissions:
          repository: read
          id-token: write
        name: Compile_Ascend_X86
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'compile_x86'
          package_name: 'cann-pyasc_linux-x86_64.whl'
          arch: 'x64'
          spec: 'xlarge'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_x86 }}
      Compile_Ascend_ARM:
        permissions:
          repository: read
          id-token: write
        name: Compile_Ascend_ARM
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'compile_arm'
          package_name: 'cann-pyasc_linux-aarch64.whl'
          arch: 'arm64'
          spec: 'large'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      Compile_Ascend_X86_ubuntu24:
        permissions:
          repository: read
          id-token: write
        name: Compile_Ascend_X86_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'compile_x86_ubuntu24'
          package_name: 'cann-pyasc_linux-x86_64_ubuntu24.whl'
          arch: 'x64'
          spec: 'large'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_ubuntu24 }}
      Compile_Ascend_ARM_ubuntu24:
        permissions:
          repository: read
          id-token: write
        name: Compile_Ascend_ARM_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'compile_arm_ubuntu24'
          package_name: 'cann-pyasc_linux-aarch64_ubuntu24.whl'
          arch: 'arm64'
          spec: 'xlarge'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_ubuntu24 }}
      JOB_codecheck:
        permissions:
          repository: read
          id-token: write
        name: CodeCheck
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_staticcheck_md_check:
         permissions:
           repository: read
           id-token: write
         name: CodeCheck_staticcheck_md_check
         uses: .gitcode/workflows/staticcheck_action.yml
         with:
           check_type: 'md_check'
           image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
    pre:
    - type: auto
  stage3:
    name: UT
    select: selected_by_default
    jobs:
      UT_Test:
        permissions:
          repository: read
          id-token: write
        name: UT_Test
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'cpp'
          spec: 'xlarge'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test }}
      UT_Test_Python:
        permissions:
          repository: read
          id-token: write
        name: UT_Test_Python
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'python'
          spec: 'large'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_Python }}
    pre:
    - type: auto
  stage4:
    name: PreSmoke
    jobs:
      PreSmoke_A2:
        permissions:
          repository: read
          id-token: write
        name: PreSmoke_A2
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          -
            name: oidc_auth
            uses: huaweicloud-oidc-auth
            with:
              audience: ${{ secrets.audience }}
              agency_urn: ${{ secrets.agency_urn }}
              provider_urn: ${{ secrets.provider_urn }}
              region: cn-north-4
              duration: 3600
          -
            name: download pr files
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
                ${{ env.obs_path }}/update_file_detail.txt
                ${{ env.obs_path }}/pre_smoke.sh
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: smoke executor
            timeout-minutes: 30
            run: |
              set -e
              # set env
              export download_path=${{ steps.process_download.outputs.download-path }}
              export package_name=${{jobs.Compile_Ascend_ARM_ubuntu24.outputs.package_name}}
              export obs_path=${{env.obs_path}}
              export repo_name=${{env.repo_name}}
              export obs_smoke_path=${{ env.obs_smoke_path }}
              export pr_id=${{ env.MERGE_ID }}
              cd ${{ steps.process_checkout.outputs.path }}
              bash ${{ steps.process_checkout.outputs.path }}/pre_smoke.sh
          -
            name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              artifact-path: "${{ steps.process_checkout.outputs.path }}/slog.tar.gz"
              object-prefix: ${obs_smoke_path}/plog/
        if: env.TARGET_BRANCH == 'master'
        runs-on: ['self-hosted','npu=2','smoke=204']
        container:
          image: swr.cn-south-1.myhuaweicloud.com/pre_smoke/ubuntu24.04_arm:pre_mindspore_A2_conda_v1.1055
    pre:
    - type: auto
    fail-fast: true
post:
  jobs:
    job_post:
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master
